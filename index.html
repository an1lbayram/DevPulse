<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevPulse - Detect developer tools, check versions, and safely update supported components." />
    <meta name="theme-color" content="#0a0e17" />
    <link rel="manifest" href="/manifest.json" />
    <title>DevPulse - Developer Tool Manager &amp; Updater</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
